name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'
      - name: Accept SDK licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Merge asset pack into app assets
        run: |
          mkdir -p app/src/main/assets
          cp -r asset-pack/. app/src/main/assets/
      - name: Apply brand resources (app icon + Poppins)
        run: cp -r brand/res_override/. app/src/main/res/
      - name: Create debug keystore
        run: keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log || {
            grep -E "^e: |error:|What went wrong|> " build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - name: Run unit tests (report only)
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --continue 2>&1 | tee test.log || true
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] || continue
            python3 - "$f" <<'PY'
import sys, xml.etree.ElementTree as ET
r = ET.parse(sys.argv[1]).getroot()
print(f"::notice::TESTS {r.get('name')}: tests={r.get('tests')} failures={r.get('failures')} errors={r.get('errors')} skipped={r.get('skipped')}")
for tc in r.iter('testcase'):
    for bad in list(tc.findall('failure')) + list(tc.findall('error')):
        msg = (bad.get('message') or '').replace('\n', ' ')[:300]
        print(f"::warning::FAILED {tc.get('name')[:120]} :: {msg}")
PY
          done
      - uses: actions/upload-artifact@v4
        with:
          name: DeskRacerLAN-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK to apk branch and release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/out && cp app/build/outputs/apk/debug/*.apk /tmp/out/DeskRacerLAN.apk
          cd /tmp/out && git init -q -b apk && git add DeskRacerLAN.apk
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "APK from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk
          cd "$GITHUB_WORKSPACE"
          gh release delete latest-apk -y --cleanup-tag || true
          gh release create latest-apk /tmp/out/DeskRacerLAN.apk --title "Desk Racer LAN (latest debug APK)" --notes "Built from ${GITHUB_SHA::7}" --target "$GITHUB_SHA"
