<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="flame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF3D7F" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#FF3D7F"/>
      <stop offset="0.8" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#FFD166"/>
    </linearGradient>
    <linearGradient id="flameCore" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFE9A8" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFF6D6"/>
    </linearGradient>
    <linearGradient id="bodyTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE27A"/><stop offset="1" stop-color="#FFC93C"/>
    </linearGradient>
    <linearGradient id="bodyMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB547"/><stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="bodyBot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E58A00"/><stop offset="1" stop-color="#B86A00"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1F5F9"/><stop offset="0.5" stop-color="#94A3B8"/><stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F3C98B"/><stop offset="1" stop-color="#D9A066"/>
    </linearGradient>
    <linearGradient id="eraser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8FB1"/><stop offset="1" stop-color="#E5487A"/>
    </linearGradient>
    <pattern id="check" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="#F8FAFC"/><rect width="14" height="14" fill="#0B1020"/><rect x="14" y="14" width="14" height="14" fill="#0B1020"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>

  <!-- whole pencil-rocket rotated, centred in the adaptive-icon safe zone -->
  <g transform="translate(500 532) rotate(-32) scale(0.98 1.28)">
    <!-- speed streaks -->
    <g stroke-linecap="round" opacity="0.95">
      <line x1="-470" y1="-58" x2="-300" y2="-58" stroke="#2DE2E6" stroke-width="18"/>
      <line x1="-520" y1="2" x2="-330" y2="2" stroke="#FF3D7F" stroke-width="22"/>
      <line x1="-455" y1="62" x2="-310" y2="62" stroke="#2DE2E6" stroke-width="18"/>
    </g>
    <!-- exhaust flame -->
    <path d="M-300 -60 C -400 -50, -470 -14, -540 0 C -470 14, -400 50, -300 60 Z" fill="url(#flame)" filter="url(#soft)" opacity="0.9"/>
    <path d="M-300 -42 C -375 -30, -425 -8, -465 0 C -425 8, -375 30, -300 42 Z" fill="url(#flame)"/>
    <path d="M-300 -18 C -335 -10, -352 -3, -366 0 C -352 3, -335 10, -300 18 Z" fill="url(#flameCore)"/>

    <g filter="url(#shadow)">
      <!-- eraser -->
      <rect x="-300" y="-66" width="70" height="132" rx="26" fill="url(#eraser)"/>
      <!-- ferrule with checkered racing band -->
      <rect x="-242" y="-70" width="92" height="140" rx="8" fill="url(#metal)"/>
      <rect x="-232" y="-70" width="72" height="140" fill="url(#check)" opacity="0.92"/>
      <rect x="-242" y="-70" width="10" height="140" fill="#CBD5E1"/>
      <rect x="-160" y="-70" width="10" height="140" fill="#CBD5E1"/>
      <!-- hexagonal body: three faces -->
      <rect x="-150" y="-66" width="330" height="44" fill="url(#bodyTop)"/>
      <rect x="-150" y="-22" width="330" height="44" fill="url(#bodyMid)"/>
      <rect x="-150" y="22" width="330" height="44" fill="url(#bodyBot)"/>
      <!-- racing number roundel -->
      <circle cx="40" cy="0" r="40" fill="#0B1020"/>
      <circle cx="40" cy="0" r="32" fill="none" stroke="#FFFFFF" stroke-width="5"/>
      <path d="M 32 -16 L 46 -20 L 46 20 M 34 20 L 58 20" stroke="#FFFFFF" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- sharpened wood cone -->
      <path d="M180 -66 L 330 -6 Q 336 0 330 6 L 180 66 Z" fill="url(#wood)"/>
      <path d="M180 -66 L 214 -52 L 206 -22 L 222 0 L 206 22 L 214 52 L 180 66 Z" fill="#E9B377"/>
      <!-- graphite tip -->
      <path d="M 282 -25 L 338 -4 Q 346 0 338 4 L 282 25 Q 292 0 282 -25 Z" fill="#1F2937"/>
      <!-- glossy highlight -->
      <rect x="-140" y="-58" width="300" height="10" rx="5" fill="#FFFFFF" opacity="0.45"/>
    </g>
  </g>

</svg>
