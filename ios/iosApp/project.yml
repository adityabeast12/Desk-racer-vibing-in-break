name: DeskRacer
options:
  bundleIdPrefix: com.aistudio.deskracerlan
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  DeskRacer:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Info.plist
      - path: Resources/Assets.xcassets
      - path: Resources/assets
        type: folder
        buildPhase: resources
      - path: Resources/fonts
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Frameworks/DeskRacerKit.framework
        embed: true
        codeSign: false
    settings:
      base:
        PRODUCT_NAME: DeskRacer
        PRODUCT_BUNDLE_IDENTIFIER: com.aistudio.deskracerlan.ios
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ENABLE_BITCODE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/Frameworks
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""
